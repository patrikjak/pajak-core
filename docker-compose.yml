name: pajak-core

services:
  cli:
    image: patrikjak/php-frankenphp:8.5-cli
    container_name: "pajak-core-cli"
    environment:
      XDEBUG_MODE: develop,debug,coverage
    volumes:
      - ".:/var/www"

  node:
    image: node:25-alpine
    container_name: "pajak-core-node"
    working_dir: /app
    volumes:
      - ".:/app"
      - "../ui:/pajak-ui:ro"

  test-db:
    image: mariadb:11
    container_name: "pajak-core-test-db"
    environment:
      MARIADB_DATABASE: testing
      MARIADB_USER: testing
      MARIADB_PASSWORD: testing
      MARIADB_ROOT_PASSWORD: testing
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  test:
    image: patrikjak/php-frankenphp:8.5-cli
    container_name: "pajak-core-test"
    environment:
      DB_HOST: pajak-core-test-db
    volumes:
      - ".:/var/www"
    depends_on:
      test-db:
        condition: service_healthy
